<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA de Scrip</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif;height:100vh}.app{display:flex;height:100vh}.side{width:245px;background:#080d19;border-right:1px solid #202942;padding:14px}.brand{font-size:20px;font-weight:800;padding:12px}.brand b{color:#6ea8ff}.new,.tool{width:100%;margin:5px 0;padding:11px;border-radius:10px;border:1px solid #293858;background:#11182c;color:#fff;text-align:left;cursor:pointer}.label{color:#687896;font-size:11px;margin:18px 10px 5px}.main{flex:1;display:flex;flex-direction:column}.top{height:60px;border-bottom:1px solid #202942;padding:20px;font-weight:700}.chat{flex:1;overflow:auto;padding:25px 18px 125px}.wrap{max-width:800px;margin:auto}.msg{display:flex;gap:12px;margin:24px 0}.avatar{width:32px;height:32px;min-width:32px;border-radius:9px;background:#315fc7;display:flex;align-items:center;justify-content:center}.user .avatar{background:#27324c}.text{line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.composer{position:fixed;bottom:0;left:245px;right:0;padding:15px;background:linear-gradient(transparent,#0b1020 30%)}.box{max-width:800px;margin:auto;background:#11182c;border:1px solid #344362;border-radius:16px;padding:10px;display:flex;gap:8px}.box textarea{flex:1;background:none;border:0;outline:0;color:white;resize:none;font:15px Arial;padding:8px}.send{width:44px;height:44px;border:0;border-radius:12px;background:#4d83ff;color:#fff;font-size:18px}.hint{text-align:center;color:#657492;font-size:11px;margin-top:7px}@media(max-width:650px){.side{display:none}.composer{left:0}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🤖 IA de <b>Scrip</b></div><button class="new" onclick="nuevo()">＋ Nuevo chat</button><div class="label">Especialidades</div><button class="tool" onclick="usar('Roblox')">🎮 Roblox</button><button class="tool" onclick="usar('Free Fire')">🔥 Free Fire</button><button class="tool" onclick="usar('Videojuegos')">🕹️ Videojuegos</button><button class="tool" onclick="usar('Página web')">🌐 Página web</button><button class="tool" onclick="usar('Programación')">💻 Programación</button></aside>
<main class="main"><div class="top">IA de Scrip · Asistente de desarrollo</div><div class="chat" id="chat"><div class="wrap" id="msgs"><div class="msg"><div class="avatar">🤖</div><div class="text">¡Hola! Soy IA de Scrip 👋<br><br>Puedo ayudarte con Roblox, Free Fire, videojuegos, páginas web y programación.<br><br>¿Qué quieres crear?</div></div></div></div><div class="composer"><div class="box"><textarea id="input" rows="1" placeholder="Escribe un mensaje..."></textarea><button class="send" onclick="send()">↑</button></div><div class="hint">La respuesta se genera mediante el servidor de IA.</div></div></main></div>
<script>
const input=document.getElementById("input"),msgs=document.getElementById("msgs"),chat=document.getElementById("chat");let history=[];
function add(role,text){let m=document.createElement("div");m.className="msg "+role;m.innerHTML='<div class="avatar">'+(role==="user"?"👤":"🤖")+'</div><div class="text"></div>';m.querySelector(".text").textContent=text;msgs.appendChild(m);chat.scrollTop=chat.scrollHeight}
function usar(x){input.value="Quiero ayuda con "+x+": ";input.focus()}
function nuevo(){history=[];msgs.innerHTML='<div class="msg"><div class="avatar">🤖</div><div class="text">Nuevo chat iniciado. ¿Qué quieres crear?</div></div>'}
async function send(){let q=input.value.trim();if(!q)return;add("user",q);history.push({role:"user",content:q});input.value="";let wait="Generando respuesta...";add("assistant",wait);let node=msgs.lastElementChild.querySelector(".text");try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});let d=await r.json();if(!r.ok)throw Error(d.error);history.push({role:"assistant",content:d.reply});node.textContent=d.reply}catch(e){node.textContent="Error: "+e.message}}
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}})
</script></body></html>
